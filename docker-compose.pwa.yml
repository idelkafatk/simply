version: "3.8"

services:
  ghost:
    image: ghost:6.54.0-alpine
    restart: always
    networks:
      - dokploy-network
      - default
    environment:
      database__client: mysql
      database__connection__host: db
      database__connection__user: root
      database__connection__password: ${MYSQL_ROOT_PASSWORD}
      database__connection__database: ghost
      url: https://${GHOST_HOST}
      NODE_ENV: production
      mail__transport: SMTP
      mail__options__host: smtp.resend.com
      mail__options__port: 587
      mail__options__secure: "false"
      mail__options__auth__user: resend
      mail__options__auth__pass: ${RESEND_API_KEY}
      mail__from: '"Idel.Blog" <noreply@idel.blog>'
    volumes:
      - ghost:/var/lib/ghost/content
    depends_on:
      - db

  ghost-proxy:
    image: nginx:alpine
    restart: always
    networks:
      - dokploy-network
      - default
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf << 'EOF'
        server {
            listen 80;
            client_max_body_size 50m;

            set_real_ip_from 10.0.0.0/8;
            set_real_ip_from 172.16.0.0/12;
            set_real_ip_from 192.168.0.0/16;
            real_ip_header X-Forwarded-For;
            real_ip_recursive on;

            resolver 127.0.0.11 valid=5s;
            set $$upstream http://ghost:2368;

            location = /sw.js {
                proxy_pass $$upstream/assets/pwa/sw.js;
                proxy_connect_timeout 5s;
                proxy_next_upstream error timeout;
                proxy_set_header Host $$host;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;

                proxy_hide_header Cache-Control;
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Service-Worker-Allowed "/" always;
                add_header X-Content-Type-Options "nosniff" always;
            }

            location = /js/script.js {
                proxy_pass https://analytics.cozywave.xyz/js/script.js;
                proxy_ssl_server_name on;
                proxy_set_header Host analytics.cozywave.xyz;
            }

            location = /api/event {
                proxy_pass https://analytics.cozywave.xyz/api/event;
                proxy_ssl_server_name on;
                proxy_buffering on;
                proxy_http_version 1.1;
                proxy_set_header Host analytics.cozywave.xyz;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
                proxy_set_header X-Forwarded-Host $$host;
            }

            location / {
                proxy_pass $$upstream;
                proxy_connect_timeout 5s;
                proxy_next_upstream error timeout;
                proxy_set_header Host $$host;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
            }
        }
        EOF
        nginx -g 'daemon off;'
    depends_on:
      - ghost

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ghost
    volumes:
      - db:/var/lib/mysql

networks:
  dokploy-network:
    external: true

volumes:
  ghost:
  db:
