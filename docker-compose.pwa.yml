services:
  ghost:
    image: ghost:6.54.0-alpine
    restart: always
    networks:
      - dokploy-network
      - default
    environment:
      database__client: mysql
      database__connection__host: db
      database__connection__user: root
      database__connection__password: ${MYSQL_ROOT_PASSWORD}
      database__connection__database: ghost
      url: https://${GHOST_HOST}
      NODE_ENV: production
      mail__transport: SMTP
      mail__options__host: smtp.resend.com
      mail__options__port: 587
      mail__options__secure: "false"
      mail__options__auth__user: resend
      mail__options__auth__pass: ${RESEND_API_KEY}
      mail__from: '"Idel.Blog" <noreply@idel.blog>'
    volumes:
      - ghost:/var/lib/ghost/content
    depends_on:
      - db

  ghost-proxy:
    image: nginx:alpine
    restart: always
    networks:
      - dokploy-network
      - default
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf << 'EOF'
        # Upstreams are named blocks rather than variables in proxy_pass on
        # purpose: a variable forces nginx to re-resolve the container name
        # through Docker DNS on every single request, which stalls for seconds
        # at a time whenever a UDP lookup is lost. Named blocks resolve once at
        # startup and, unlike a variable, support connection reuse.
        upstream ghost_backend {
            server ghost:2368;
            keepalive 32;
        }

        # Keyed on the reader's own address. Behind Cloudflare $$binary_remote_addr
        # is the edge server, so every reader arriving through the same PoP would
        # otherwise share a single 10-requests-per-minute bucket.
        limit_req_zone $$http_cf_connecting_ip zone=push_api:10m rate=10r/m;

        server {
            listen 80;
            client_max_body_size 50m;

            set_real_ip_from 10.0.0.0/8;
            set_real_ip_from 172.16.0.0/12;
            set_real_ip_from 192.168.0.0/16;
            real_ip_header CF-Connecting-IP;

            # The push service is a separate stack, so it stays behind a runtime
            # lookup: a named upstream is resolved at startup and would stop nginx
            # from booting at all whenever that stack is down. These two endpoints
            # are called once per post view, so the lookup is not on the hot path.
            # ipv6=off avoids a pointless AAAA query on every resolve.
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $$push_upstream http://idel-blog-push-service:3000;

            location = /sw.js {
                proxy_pass http://ghost_backend/assets/pwa/sw.js;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_connect_timeout 5s;
                proxy_next_upstream error timeout;
                proxy_set_header Host $$host;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;

                proxy_hide_header Cache-Control;
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Service-Worker-Allowed "/" always;
                add_header X-Content-Type-Options "nosniff" always;
            }

            location = /js/script.js {
                proxy_pass https://analytics.cozywave.xyz/js/script.js;
                proxy_ssl_server_name on;
                proxy_set_header Host analytics.cozywave.xyz;
            }

            location = /api/event {
                proxy_pass https://analytics.cozywave.xyz/api/event;
                proxy_ssl_server_name on;
                proxy_buffering on;
                proxy_http_version 1.1;
                proxy_set_header Host analytics.cozywave.xyz;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
                proxy_set_header X-Forwarded-Host $$host;
            }

            location /api/push/ {
                limit_req zone=push_api burst=10 nodelay;
                proxy_pass $$push_upstream;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_connect_timeout 5s;
                proxy_read_timeout 10s;
                proxy_set_header Host $$host;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
            }

            location = /webhooks/ghost/post-published {
                proxy_pass $$push_upstream;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_connect_timeout 5s;
                proxy_read_timeout 30s;
                proxy_set_header Host $$host;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Ghost-Signature $$http_x_ghost_signature;
            }

            location / {
                proxy_pass http://ghost_backend;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_connect_timeout 5s;
                proxy_next_upstream error timeout;
                proxy_set_header Host $$host;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
            }
        }
        EOF
        nginx -g 'daemon off;'
    depends_on:
      - ghost

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ghost
    volumes:
      - db:/var/lib/mysql

networks:
  dokploy-network:
    external: true

volumes:
  ghost:
  db:
